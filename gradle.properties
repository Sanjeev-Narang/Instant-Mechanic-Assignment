# Project-wide Gradle settings.
# Optimized for 8 GB RAM + physical device (no emulator).
# Budget: Studio ~1536m + Gradle daemon ~2048m + Kotlin daemon ~1024m for 3 workers.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
# Keep daemon + build cache + configuration cache on for faster Run (play button).
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Single-module project: parallel gains nothing, costs RAM.
org.gradle.parallel=false
org.gradle.configureondemand=false
# 3 workers: good balance of speed vs RAM on 12 CPUs with 2g daemon heap.
org.gradle.workers.max=3
# VFS watching costs memory; disable on low-RAM machines.
org.gradle.vfs.watch=false
# Cap Kotlin / KSP daemons (they default to sharing Gradle Xmx otherwise).
kotlin.daemon.jvmargs=-Xmx1024m
ksp.incremental=true
kotlin.incremental=true
# Smaller R class / faster incremental dex.
android.nonTransitiveRClass=true
android.useAndroidX=true
android.enableJetifier=false
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Allow KSP generated sources with AGP 9 built-in Kotlin (Hilt)
android.disallowKotlinSourceSets=false
